name: Supabase Keep Alive

on:
  schedule:
    - cron: "10 1,7,13,19 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ vars.SUPABASE_KEEP_ALIVE_URL || 'https://compline.aviralagarwal.com/api/health' }}
        run: curl --fail --silent --show-error "$HEALTH_URL"
